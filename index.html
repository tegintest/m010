const esc=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function setMode(v,m){modes[v]=m;answers[v]={};locked[v]={};finished[v]=false;render();document.getElementById('v'+v).scrollIntoView({behavior:'smooth',block:'start'})}
function choose(v,i,j){if(finished[v]||locked[v][i])return;let q=DATA[v][i],a=answers[v][i]||[],l=ABC[j];if(q.key.length<=1){answers[v][i]=[l];if(modes[v]==='quiz')locked[v][i]=true}else{answers[v][i]=a.includes(l)?a.filter(x=>x!==l):[...a,l]}update(v,i)}

function right(v,i){return [...(answers[v][i]||[])].sort().join('')===DATA[v][i].key.slice().sort().join('')}
function update(v,i){let q=DATA[v][i],show=finished[v]||(modes[v]==='quiz'&&locked[v][i]);document.querySelectorAll('#v'+v+'q'+i+' .opt').forEach((el,j)=>{let l=ABC[j];el.classList.toggle('selected',(answers[v][i]||[]).includes(l));el.classList.toggle('correct',show&&q.key.includes(l));el.classList.toggle('wrong',show&&(answers[v][i]||[]).includes(l)&&!q.key.includes(l));el.disabled=show});let f=document.getElementById('f'+v+'_'+i);f.innerHTML=show?'<div class="feedback"><b>'+(right(v,i)?'Дұрыс!':'Қате жауап')+'</b><div>Дұрыс жауап: '+q.key.join(', ')+'</div><div><b>Түсіндірме:</b> '+esc(q.why)+'</div></div>':'';let c=document.getElementById('c'+v+'_'+i);if(c)c.disabled=show||!(answers[v][i]||[]).length}
function finish(v){finished[v]=true;DATA[v].forEach((_,i)=>update(v,i));let score=DATA[v].filter((q,i)=>q.key.length&&right(v,i)).length,total=DATA[v].filter(q=>q.key.length).length;document.getElementById('result'+v).innerHTML='<div class="result"><h2>Нәтиже: '+score+' / '+total+'</h2><p>Дұрыс: '+score+' · Қате немесе жауапсыз: '+(total-score)+'</p><button class="btn" onclick="setMode('+v+',modes['+v+'])">Қайта тапсыру</button></div>';document.getElementById('result'+v).scrollIntoView({behavior:'smooth'})}
